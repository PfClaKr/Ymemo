# main 에 올라가는 모든 변경에 대해 도는 검사. (릴리스 산출물은 release.yml 이 만든다.)
#
# release.yml 의 test 잡은 태그를 밀 때만 돌고 코어/FFI 만 본다. 여기서는 **워크스페이스
# 전체**를 돌린다 — 특히 ymemo-i18n 의 가드 테스트(카탈로그 키 일치, 자리표시자 일치,
# 코드가 쓰는 t! 키의 존재)는 여기가 아니면 릴리스 직전까지 아무도 돌리지 않는다.
#
# 주의: GitHub 소유 액션(actions/*)만 쓴다 — 서드파티 액션 차단 정책에서도 돌도록.
# 툴체인은 러너에 내장된 rustup 을 쓴다.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 푸시하면 앞의 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # slint 의존성이 edition2024 를, clippy 의 일부 제안이 최신 stable 을 요구한다.
      - run: rustup update stable
      - run: rustup component add clippy

      # 데스크탑(slint)까지 빌드하므로 fontconfig 가 필요하다.
      - name: Install slint deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      # 빌드 캐시. 러너 이미지가 바뀌거나 Cargo.lock 이 바뀌면 새로 만든다.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # 문서 링크가 깨지면(항목 이름을 바꾸고 문서를 안 고친 경우 등) 여기서 잡는다.
      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
