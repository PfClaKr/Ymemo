# Checks on every change headed for main; release.yml builds the artifacts.
#
# release.yml's test job only runs on a tag and only covers the core and FFI. This runs the
# **whole workspace** — in particular ymemo-i18n's guard tests (matching catalog keys,
# matching placeholders, every t! key present), which nothing else would run until release.
#
# Only GitHub-owned actions (actions/*) are used, so this still runs under a policy that
# blocks third-party ones. The toolchain is the runner's built-in rustup.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Slint's dependencies need edition2024, and some clippy lints need current stable.
      - run: rustup update stable
      - run: rustup component add clippy

      # The desktop build links fontconfig.
      - name: Install slint deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      # Build cache, rebuilt when the runner image or Cargo.lock changes.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Catches broken doc links, e.g. after renaming an item without updating its docs.
      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
