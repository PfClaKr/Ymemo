# On a release tag (v*), build the desktop and mobile binaries and attach them to a GitHub
# Release.
#
# Artifacts:
#  - ymemo_<ver>_amd64.deb         Debian/Ubuntu package, syncthing included and removed with it
#  - ymemo-<ver>-1.fc*.x86_64.rpm  Fedora package, likewise
#  - ymemo-setup-x86_64.exe        Windows installer, likewise
#  - ymemo-<ver>-android-<abi>.apk Android app, one per ABI (see below)
#  - ymemo-ffi-ios.zip             aarch64 device and simulator .a
#
# The desktop installers bundle syncthing, renamed to `ymemo-sync`(.exe): the user never
# installs it separately and it goes away with the app (see packaging/).
#
# Android builds all the way to an APK. The frb bindings and the android/ project are
# committed, so CI needs no codegen.
#   --split-per-abi: one fat APK would be enormous while a device only ever uses its own ABI,
#   so split it per ABI. Modern phones are almost all arm64-v8a; armeabi-v7a covers older
#   32-bit devices and x86_64 the emulator. Each APK carries two native pieces: the Rust core
#   and the bundled syncthing (~20MB), so expect roughly 50MB per ABI.
#   **Signing:** the APKs are signed with the release keystore when the ANDROID_KEYSTORE_*
#   secrets are set, and with the debug key otherwise — see the build step below. The debug
#   key is generated per machine, so debug-signed releases cannot be installed over one
#   another and cannot go to the Play Store; set the secrets before the first release users
#   are expected to update.
# iOS stops at the library; an IPA follows once signing is set up.
#
# Only GitHub-owned actions (actions/*) are used, so this still runs under a policy that
# blocks third-party ones. The toolchain is the runner's rustup and releases go through its
# gh CLI.

name: release

on:
  push:
    tags: ["v*"]

env:
  # syncthing version bundled with the desktop packages
  SYNCTHING_VERSION: v2.1.2
  # Flutter for the Android build, pinned to the version verified locally
  FLUTTER_VERSION: 3.47.0
  # **Must match ndkVersion in apps/mobile/android/app/build.gradle.kts.**
  # Different NDKs in gradle and cargo-ndk produce link errors that are hard to trace.
  ANDROID_NDK_VERSION: 28.2.13676358

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A tag that disagrees with the workspace version would put one number in the
      # installer's name and another in the app (CARGO_PKG_VERSION). Stop before building.
      - name: Check tag matches workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match $crate in Cargo.toml; fix workspace.package.version and re-push the tag."
            exit 1
          fi
      # Slint's dependencies need edition2024
      - run: rustup update stable
      # No GUI build here, so no fontconfig needed
      - run: cargo test -p ymemo-core -p ymemo-ffi -p ymemo-i18n

  linux-desktop:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - name: Install slint deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo build --release -p ymemo-desktop
      - name: Build .deb (bundles hidden syncthing)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sL -o st.tar.gz "https://github.com/syncthing/syncthing/releases/download/${SYNCTHING_VERSION}/syncthing-linux-amd64-${SYNCTHING_VERSION}.tar.gz"
          tar xzf st.tar.gz
          # build-deb.sh renames syncthing to ymemo-sync under /usr/lib/ymemo.
          bash packaging/linux/build-deb.sh \
            --app target/release/ymemo-desktop \
            --sync "syncthing-linux-amd64-${SYNCTHING_VERSION}/syncthing" \
            --version "$VERSION" --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: dist/*.deb

  # Fedora .rpm: build the desktop inside a Fedora container so glibc and the libraries match
  # that distribution. `container:` is built into GitHub Actions, so no action policy applies.
  fedora-desktop:
    needs: test
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # git and tar first, so checkout works properly.
      - run: dnf install -y git tar curl >/dev/null
      - uses: actions/checkout@v4
      - name: Install build deps
        run: dnf install -y rustup gcc fontconfig-devel rpm-build >/dev/null
      - name: Set up Rust (stable ≥ 1.87)
        run: |
          rustup-init -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release -p ymemo-desktop
      - name: Build .rpm (bundles hidden syncthing)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sL -o st.tar.gz "https://github.com/syncthing/syncthing/releases/download/${SYNCTHING_VERSION}/syncthing-linux-amd64-${SYNCTHING_VERSION}.tar.gz"
          tar xzf st.tar.gz
          # build-rpm.sh does the same rename into /usr/lib/ymemo.
          bash packaging/linux/build-rpm.sh \
            --app target/release/ymemo-desktop \
            --sync "syncthing-linux-amd64-${SYNCTHING_VERSION}/syncthing" \
            --version "$VERSION" --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-desktop
          path: dist/*.rpm

  windows-desktop:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo build --release -p ymemo-desktop
      - name: Build installer (bundles hidden syncthing)
        shell: pwsh
        env:
          # Optional: with these secrets the binaries and installer are code-signed;
          # without them the build is unsigned.
          #   WINDOWS_CERT_PFX_BASE64 : the PFX certificate, base64 encoded
          #   WINDOWS_CERT_PASSWORD   : its password
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          curl.exe -sL -o st.zip "https://github.com/syncthing/syncthing/releases/download/$env:SYNCTHING_VERSION/syncthing-windows-amd64-$env:SYNCTHING_VERSION.zip"
          Expand-Archive st.zip -DestinationPath st -Force
          # Rename to the names the .iss expects and put them beside it.
          Copy-Item target/release/ymemo-desktop.exe packaging/windows/Ymemo.exe -Force
          Copy-Item "st/syncthing-windows-amd64-$env:SYNCTHING_VERSION/syncthing.exe" packaging/windows/ymemo-sync.exe -Force

          # ---- Code signing, only with the certificate secrets ----
          $signArgs = @()
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "certificate found, signing the binaries and installer"
            [IO.File]::WriteAllBytes("$PWD/cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                         Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1).FullName
            $ts = "http://timestamp.digicert.com"
            # Sign the app and sync binaries before they go into the installer.
            & $signtool sign /fd sha256 /f "$PWD/cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /tr $ts /td sha256 `
              packaging/windows/Ymemo.exe packaging/windows/ymemo-sync.exe
            if ($LASTEXITCODE -ne 0) { throw "signing the binaries failed" }
            # ISCC signs the installer and uninstaller ($f is its file placeholder).
            $signCmd = "`"$signtool`" sign /fd sha256 /f `"$PWD/cert.pfx`" /p $env:WINDOWS_CERT_PASSWORD /tr $ts /td sha256 `$f"
            $signArgs = @("/DSign", "/Symemosign=$signCmd")
          } else {
            Write-Host "no certificate secrets, building unsigned (SmartScreen may warn)"
          }

          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" @signArgs packaging/windows/ymemo.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Remove-Item -Force "$PWD/cert.pfx" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item packaging/windows/Output/ymemo-setup-x86_64.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: dist/ymemo-setup-x86_64.exe

  android-app:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gradle 8 wants JDK 17; the runner's default may be newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter
        run: |
          curl -sL -o flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar xf flutter.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install the pinned NDK
        run: |
          # sdkmanager sits in different places across runner images.
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          "$sdkmanager" "ndk;$ANDROID_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Set up Rust for Android
        run: |
          rustup update stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk
      # Gradle knows nothing about Rust (no cargokit), so build the .so files into jniLibs first.
      - name: Build the rust library for all ABIs
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o apps/mobile/android/app/src/main/jniLibs build --release -p ymemo-ffi
      # The bundled sync daemon, from the same syncthing version the desktop ships.
      #
      # It goes in as `jniLibs/<abi>/libsyncthing.so` because the native library directory is
      # the only place Android still lets an app execute a binary from — the `.so` name is a
      # lie the platform requires, not a shared library. A binary from syncthing's own release
      # page cannot be used: those are non-PIE static linux builds and Android refuses to exec
      # them, so it is built here.
      #
      # Every flag below was earned; none is decoration:
      #   GOOS=android + NDK CC — Go's own net package says "DNS requests don't work on
      #     Android, so prefer the cgo resolver" (golang #10714). Without cgo the daemon
      #     cannot resolve the discovery and relay servers, leaving it LAN-only.
      #   -tags noassets — drops syncthing's embedded web GUI (~6MB per ABI). We never open
      #     it, and without this the build needs a separate `go run build.go assets` step
      #     because the generated bundle is not in the source tarball.
      #   -tags noupgrade — compiles the self-updater out; the desktop's STNOUPGRADE only
      #     disables it at runtime.
      #   -checklinkname=0 — syncthing depends on wlynxg/anet, which reaches into
      #     net.zoneCache with //go:linkname to work around Android's netlink restrictions.
      #     Go 1.23+ rejects that by default and the link fails outright.
      #
      # API 24 must stay in step with `minSdk` in apps/mobile/android/app/build.gradle.kts.
      - uses: actions/setup-go@v5
        with:
          # syncthing's go.mod asks for 1.25.
          go-version: "1.25"
          cache: false
      - name: Build syncthing for all ABIs
        env:
          ANDROID_API: "24"
        run: |
          curl -sL -o st-src.tar.gz \
            "https://github.com/syncthing/syncthing/archive/refs/tags/${SYNCTHING_VERSION}.tar.gz"
          mkdir -p st-src && tar xzf st-src.tar.gz -C st-src --strip-components=1
          ndk="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          out="$GITHUB_WORKSPACE/apps/mobile/android/app/src/main/jniLibs"
          # <abi> <GOARCH> <clang triple prefix> [GOARM]
          build_abi() {
            echo "::group::syncthing for $1"
            mkdir -p "$out/$1"
            (cd st-src && CGO_ENABLED=1 GOOS=android GOARCH="$2" GOARM="${4:-}" \
              CC="$ndk/$3$ANDROID_API-clang" \
              go build -buildmode=pie -tags "noupgrade noassets" \
                -ldflags "-s -w -checklinkname=0" \
                -o "$out/$1/libsyncthing.so" ./cmd/syncthing)
            # Must say "pie executable ... interpreter /system/bin/linker64"; anything else
            # will not start on a device.
            file "$out/$1/libsyncthing.so"
            echo "::endgroup::"
          }
          build_abi arm64-v8a   arm64 aarch64-linux-android
          build_abi armeabi-v7a arm   armv7a-linux-androideabi 7
          build_abi x86_64      amd64 x86_64-linux-android
      # Signing: with the keystore secrets the APKs are signed with the release key, which is
      # what lets a user install a new version over the old one. Without them the build falls
      # back to the debug key (see apps/mobile/android/app/build.gradle.kts) and every release
      # gets a different, runner-generated signature that no earlier install accepts.
      #   ANDROID_KEYSTORE_BASE64   : the keystore (.jks), base64 encoded
      #   ANDROID_KEYSTORE_PASSWORD : its password
      #   ANDROID_KEY_ALIAS         : the key alias inside it
      #   ANDROID_KEY_PASSWORD      : that key's password (defaults to the store password)
      #
      # Version: taken from the tag, never from pubspec.yaml. **Android decides what is an
      # update by comparing versionCode, an integer** — a name it never reads. pubspec's
      # `version:` was left behind at 0.9.1+2 while the workspace moved on, so v0.9.2 and
      # v0.9.3 both shipped versionCode 2002 and neither could update the other. Deriving it
      # here means the number cannot drift from the release again, and the job that checks
      # the tag against Cargo.toml already guarantees the two agree.
      #
      #   code = major*10000 + minor*100 + patch, so 0.9.3 -> 903 and every later release is
      #   a larger number. `--split-per-abi` then adds 1000 * Flutter's ABI index on top
      #   (v7a 1, arm64 2, x86_64 4), which stays constant per ABI and so does not disturb
      #   the ordering a device sees.
      - name: Build the apk
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          YMEMO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          YMEMO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          YMEMO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "keystore found, signing the apks with the release key"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ymemo.jks"
            export YMEMO_KEYSTORE_FILE="$RUNNER_TEMP/ymemo.jks"
          else
            echo "::warning::no android keystore secrets; the apks are signed with the debug key and cannot update an existing install"
          fi
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          # A tag like v1.0.0-rc1 would otherwise make the arithmetic fail rather than round.
          patch="${patch%%[!0-9]*}"
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "version $version -> versionCode $code (before the per-abi offset)"
          flutter pub get
          flutter build apk --release --split-per-abi \
            --build-name="$version" --build-number="$code"
          rm -f "$RUNNER_TEMP/ymemo.jks"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "build/app/outputs/flutter-apk/app-$abi-release.apk" \
              "$GITHUB_WORKSPACE/ymemo-$version-android-$abi.apk"
          done
      # Cheap insurance against the flags above silently not taking: a versionCode of 2 (the
      # pubspec default) would ship an APK that no existing install accepts as an update, and
      # nothing else in the pipeline would notice.
      - name: Check the apks carry the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)aapt2"
          for apk in ymemo-*-android-*.apk; do
            line="$("$aapt2" dump badging "$apk" | head -1)"
            echo "$apk: $line"
            case "$line" in
              *"versionName='$version'"*) ;;
              *) echo "::error::$apk is not versionName $version"; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: ymemo-*-android-*.apk

  ios-lib:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup update stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Build static libs (device + simulator)
        run: |
          cargo build --release --target aarch64-apple-ios -p ymemo-ffi
          cargo build --release --target aarch64-apple-ios-sim -p ymemo-ffi
          mkdir -p ios-libs/device ios-libs/simulator
          cp target/aarch64-apple-ios/release/libymemo_ffi.a ios-libs/device/
          cp target/aarch64-apple-ios-sim/release/libymemo_ffi.a ios-libs/simulator/
          zip -r ymemo-ffi-ios.zip ios-libs
      - uses: actions/upload-artifact@v4
        with:
          name: ios-lib
          path: ymemo-ffi-ios.zip

  release:
    needs: [linux-desktop, fedora-desktop, windows-desktop, android-app, ios-lib]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            ymemo_*_amd64.deb \
            ymemo-*.rpm \
            ymemo-setup-x86_64.exe \
            ymemo-*-android-*.apk \
            ymemo-ffi-ios.zip
