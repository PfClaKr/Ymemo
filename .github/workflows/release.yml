# On a release tag (v*), build the desktop and mobile binaries and attach them to a GitHub
# Release.
#
# Artifacts:
#  - ymemo_<ver>_amd64.deb         Debian/Ubuntu package, syncthing included and removed with it
#  - ymemo-<ver>-1.fc*.x86_64.rpm  Fedora package, likewise
#  - ymemo-setup-x86_64.exe        Windows installer, likewise
#  - ymemo-<ver>-android-<abi>.apk Android app, one per ABI (see below)
#  - ymemo-ffi-ios.zip             aarch64 device and simulator .a
#
# The desktop installers bundle syncthing, renamed to `ymemo-sync`(.exe): the user never
# installs it separately and it goes away with the app (see packaging/).
#
# Android builds all the way to an APK. The frb bindings and the android/ project are
# committed, so CI needs no codegen.
#   --split-per-abi: one fat APK would be 76MB while a device only ever uses its own ABI, so
#   split it into 23-32MB each. Modern phones are almost all arm64-v8a; armeabi-v7a covers
#   older 32-bit devices and x86_64 the emulator.
#   **Signing:** as flutter create leaves it, the release APK is signed with the *debug* key
#   (see signingConfig in apps/mobile/android/app/build.gradle.kts). It installs and
#   distributes fine, but cannot go to the Play Store and needs "unknown sources" enabled.
#   Real signing means a keystore from secrets, as the windows-desktop job does with its
#   certificate.
# iOS stops at the library; an IPA follows once signing is set up.
#
# Only GitHub-owned actions (actions/*) are used, so this still runs under a policy that
# blocks third-party ones. The toolchain is the runner's rustup and releases go through its
# gh CLI.

name: release

on:
  push:
    tags: ["v*"]

env:
  # syncthing version bundled with the desktop packages
  SYNCTHING_VERSION: v2.1.2
  # Flutter for the Android build, pinned to the version verified locally
  FLUTTER_VERSION: 3.47.0
  # **Must match ndkVersion in apps/mobile/android/app/build.gradle.kts.**
  # Different NDKs in gradle and cargo-ndk produce link errors that are hard to trace.
  ANDROID_NDK_VERSION: 28.2.13676358

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A tag that disagrees with the workspace version would put one number in the
      # installer's name and another in the app (CARGO_PKG_VERSION). Stop before building.
      - name: Check tag matches workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match $crate in Cargo.toml; fix workspace.package.version and re-push the tag."
            exit 1
          fi
      # Slint's dependencies need edition2024
      - run: rustup update stable
      # No GUI build here, so no fontconfig needed
      - run: cargo test -p ymemo-core -p ymemo-ffi -p ymemo-i18n

  linux-desktop:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - name: Install slint deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo build --release -p ymemo-desktop
      - name: Build .deb (bundles hidden syncthing)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sL -o st.tar.gz "https://github.com/syncthing/syncthing/releases/download/${SYNCTHING_VERSION}/syncthing-linux-amd64-${SYNCTHING_VERSION}.tar.gz"
          tar xzf st.tar.gz
          # build-deb.sh renames syncthing to ymemo-sync under /usr/lib/ymemo.
          bash packaging/linux/build-deb.sh \
            --app target/release/ymemo-desktop \
            --sync "syncthing-linux-amd64-${SYNCTHING_VERSION}/syncthing" \
            --version "$VERSION" --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: dist/*.deb

  # Fedora .rpm: build the desktop inside a Fedora container so glibc and the libraries match
  # that distribution. `container:` is built into GitHub Actions, so no action policy applies.
  fedora-desktop:
    needs: test
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # git and tar first, so checkout works properly.
      - run: dnf install -y git tar curl >/dev/null
      - uses: actions/checkout@v4
      - name: Install build deps
        run: dnf install -y rustup gcc fontconfig-devel rpm-build >/dev/null
      - name: Set up Rust (stable ≥ 1.87)
        run: |
          rustup-init -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release -p ymemo-desktop
      - name: Build .rpm (bundles hidden syncthing)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sL -o st.tar.gz "https://github.com/syncthing/syncthing/releases/download/${SYNCTHING_VERSION}/syncthing-linux-amd64-${SYNCTHING_VERSION}.tar.gz"
          tar xzf st.tar.gz
          # build-rpm.sh does the same rename into /usr/lib/ymemo.
          bash packaging/linux/build-rpm.sh \
            --app target/release/ymemo-desktop \
            --sync "syncthing-linux-amd64-${SYNCTHING_VERSION}/syncthing" \
            --version "$VERSION" --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-desktop
          path: dist/*.rpm

  windows-desktop:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo build --release -p ymemo-desktop
      - name: Build installer (bundles hidden syncthing)
        shell: pwsh
        env:
          # Optional: with these secrets the binaries and installer are code-signed;
          # without them the build is unsigned.
          #   WINDOWS_CERT_PFX_BASE64 : the PFX certificate, base64 encoded
          #   WINDOWS_CERT_PASSWORD   : its password
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          curl.exe -sL -o st.zip "https://github.com/syncthing/syncthing/releases/download/$env:SYNCTHING_VERSION/syncthing-windows-amd64-$env:SYNCTHING_VERSION.zip"
          Expand-Archive st.zip -DestinationPath st -Force
          # Rename to the names the .iss expects and put them beside it.
          Copy-Item target/release/ymemo-desktop.exe packaging/windows/Ymemo.exe -Force
          Copy-Item "st/syncthing-windows-amd64-$env:SYNCTHING_VERSION/syncthing.exe" packaging/windows/ymemo-sync.exe -Force

          # ---- Code signing, only with the certificate secrets ----
          $signArgs = @()
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "certificate found, signing the binaries and installer"
            [IO.File]::WriteAllBytes("$PWD/cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                         Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1).FullName
            $ts = "http://timestamp.digicert.com"
            # Sign the app and sync binaries before they go into the installer.
            & $signtool sign /fd sha256 /f "$PWD/cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /tr $ts /td sha256 `
              packaging/windows/Ymemo.exe packaging/windows/ymemo-sync.exe
            if ($LASTEXITCODE -ne 0) { throw "signing the binaries failed" }
            # ISCC signs the installer and uninstaller ($f is its file placeholder).
            $signCmd = "`"$signtool`" sign /fd sha256 /f `"$PWD/cert.pfx`" /p $env:WINDOWS_CERT_PASSWORD /tr $ts /td sha256 `$f"
            $signArgs = @("/DSign", "/Symemosign=$signCmd")
          } else {
            Write-Host "no certificate secrets, building unsigned (SmartScreen may warn)"
          }

          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" @signArgs packaging/windows/ymemo.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Remove-Item -Force "$PWD/cert.pfx" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item packaging/windows/Output/ymemo-setup-x86_64.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: dist/ymemo-setup-x86_64.exe

  android-app:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gradle 8 wants JDK 17; the runner's default may be newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter
        run: |
          curl -sL -o flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          tar xf flutter.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install the pinned NDK
        run: |
          # sdkmanager sits in different places across runner images.
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          "$sdkmanager" "ndk;$ANDROID_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Set up Rust for Android
        run: |
          rustup update stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk
      # Gradle knows nothing about Rust (no cargokit), so build the .so files into jniLibs first.
      - name: Build the rust library for all ABIs
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o apps/mobile/android/app/src/main/jniLibs build --release -p ymemo-ffi
      - name: Build the apk
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          version="${GITHUB_REF_NAME#v}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "build/app/outputs/flutter-apk/app-$abi-release.apk" \
              "$GITHUB_WORKSPACE/ymemo-$version-android-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: ymemo-*-android-*.apk

  ios-lib:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup update stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Build static libs (device + simulator)
        run: |
          cargo build --release --target aarch64-apple-ios -p ymemo-ffi
          cargo build --release --target aarch64-apple-ios-sim -p ymemo-ffi
          mkdir -p ios-libs/device ios-libs/simulator
          cp target/aarch64-apple-ios/release/libymemo_ffi.a ios-libs/device/
          cp target/aarch64-apple-ios-sim/release/libymemo_ffi.a ios-libs/simulator/
          zip -r ymemo-ffi-ios.zip ios-libs
      - uses: actions/upload-artifact@v4
        with:
          name: ios-lib
          path: ymemo-ffi-ios.zip

  release:
    needs: [linux-desktop, fedora-desktop, windows-desktop, android-app, ios-lib]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            ymemo_*_amd64.deb \
            ymemo-*.rpm \
            ymemo-setup-x86_64.exe \
            ymemo-*-android-*.apk \
            ymemo-ffi-ios.zip
