# 릴리스 태그(v*)가 올라오면 데스크탑/모바일 바이너리를 빌드해 GitHub Release 에 첨부한다.
#
# 산출물:
#  - ymemo_<ver>_amd64.deb               (Debian/Ubuntu 패키지 — syncthing 포함, 제거 시 함께 삭제)
#  - ymemo-<ver>-1.fc*.x86_64.rpm        (Fedora 패키지 — syncthing 포함, 제거 시 함께 삭제)
#  - ymemo-setup-x86_64.exe              (Windows 인스톨러 — syncthing 포함, 제거 시 함께 삭제)
#  - ymemo-ffi-android-jniLibs.zip       (arm64-v8a / armeabi-v7a / x86_64 .so)
#  - ymemo-ffi-ios.zip                   (aarch64 기기·시뮬레이터 .a)
#
# 데스크탑은 syncthing 을 인스톨러 안에 번들해 `ymemo-sync`(.exe) 로 리네임 설치한다.
# 사용자는 syncthing 을 별도로 받지 않고, 앱 제거 시 함께 지워진다 (packaging/ 참조).
#
# 모바일은 현재 Rust FFI 라이브러리까지만 빌드한다. APK/IPA 패키징은
# flutter_rust_bridge codegen + flutter create + 서명 설정이 갖춰지면 추가한다
# (apps/mobile/README.md 참조).
#
# 주의: GitHub 소유 액션(actions/*)만 쓴다 — 서드파티 액션 차단 정책에서도 돌도록.
# 툴체인은 러너에 내장된 rustup, 릴리스 생성은 내장 gh CLI 를 쓴다.

name: release

on:
  push:
    tags: ["v*"]

env:
  # 데스크탑에 번들할 syncthing 버전 (통째 번들 결정 사항)
  SYNCTHING_VERSION: v2.1.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # slint 의존성이 edition2024 를 요구 → 최신 stable 로 갱신
      - run: rustup update stable
      # GUI(slint) 를 빌드하지 않으므로 fontconfig 불필요
      - run: cargo test -p ymemo-core -p ymemo-ffi

  linux-desktop:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - name: Install slint deps
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo build --release -p ymemo-desktop
      - name: Build .deb (bundles hidden syncthing)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sL -o st.tar.gz "https://github.com/syncthing/syncthing/releases/download/${SYNCTHING_VERSION}/syncthing-linux-amd64-${SYNCTHING_VERSION}.tar.gz"
          tar xzf st.tar.gz
          # build-deb.sh 가 syncthing 을 ymemo-sync 로 리네임해 /usr/lib/ymemo 에 넣는다.
          bash packaging/linux/build-deb.sh \
            --app target/release/ymemo-desktop \
            --sync "syncthing-linux-amd64-${SYNCTHING_VERSION}/syncthing" \
            --version "$VERSION" --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop
          path: dist/*.deb

  # Fedora .rpm — 데스크탑을 Fedora 컨테이너 안에서 빌드해 glibc/라이브러리를
  # 그 배포판에 맞춘다. (ubuntu 러너 위의 container: 는 GitHub 내장 기능이라 액션 정책과 무관)
  fedora-desktop:
    needs: test
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # checkout 이 제대로 되도록 git/tar 를 먼저 깐다.
      - run: dnf install -y git tar curl >/dev/null
      - uses: actions/checkout@v4
      - name: Install build deps
        run: dnf install -y rustup gcc fontconfig-devel rpm-build >/dev/null
      - name: Set up Rust (stable ≥ 1.85)
        run: |
          rustup-init -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release -p ymemo-desktop
      - name: Build .rpm (bundles hidden syncthing)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sL -o st.tar.gz "https://github.com/syncthing/syncthing/releases/download/${SYNCTHING_VERSION}/syncthing-linux-amd64-${SYNCTHING_VERSION}.tar.gz"
          tar xzf st.tar.gz
          # build-rpm.sh 도 syncthing 을 ymemo-sync 로 리네임해 /usr/lib/ymemo 에 넣는다.
          bash packaging/linux/build-rpm.sh \
            --app target/release/ymemo-desktop \
            --sync "syncthing-linux-amd64-${SYNCTHING_VERSION}/syncthing" \
            --version "$VERSION" --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: fedora-desktop
          path: dist/*.rpm

  windows-desktop:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - run: cargo build --release -p ymemo-desktop
      - name: Build installer (bundles hidden syncthing)
        shell: pwsh
        env:
          # 선택: 이 시크릿들이 있으면 바이너리·인스톨러를 코드 서명한다. 없으면 미서명 빌드.
          #   WINDOWS_CERT_PFX_BASE64 : PFX 인증서를 base64 로 인코딩한 값
          #   WINDOWS_CERT_PASSWORD   : PFX 암호
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          curl.exe -sL -o st.zip "https://github.com/syncthing/syncthing/releases/download/$env:SYNCTHING_VERSION/syncthing-windows-amd64-$env:SYNCTHING_VERSION.zip"
          Expand-Archive st.zip -DestinationPath st -Force
          # 인스톨러(.iss)가 참조하는 이름으로 리네임해 .iss 옆에 둔다.
          Copy-Item target/release/ymemo-desktop.exe packaging/windows/Ymemo.exe -Force
          Copy-Item "st/syncthing-windows-amd64-$env:SYNCTHING_VERSION/syncthing.exe" packaging/windows/ymemo-sync.exe -Force

          # ---- 코드 서명 (인증서 시크릿이 있을 때만) ----
          $signArgs = @()
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "인증서 발견 → 바이너리·인스톨러 서명."
            [IO.File]::WriteAllBytes("$PWD/cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                         Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1).FullName
            $ts = "http://timestamp.digicert.com"
            # 앱·sync 바이너리 먼저 서명 (인스톨러 안에 들어가기 전에).
            & $signtool sign /fd sha256 /f "$PWD/cert.pfx" /p $env:WINDOWS_CERT_PASSWORD /tr $ts /td sha256 `
              packaging/windows/Ymemo.exe packaging/windows/ymemo-sync.exe
            if ($LASTEXITCODE -ne 0) { throw "바이너리 서명 실패" }
            # 인스톨러/언인스톨러 서명은 ISCC 에 위임 ($f = 서명할 파일 자리표시자).
            $signCmd = "`"$signtool`" sign /fd sha256 /f `"$PWD/cert.pfx`" /p $env:WINDOWS_CERT_PASSWORD /tr $ts /td sha256 `$f"
            $signArgs = @("/DSign", "/Symemosign=$signCmd")
          } else {
            Write-Host "인증서 시크릿 없음 → 미서명 빌드 (SmartScreen 경고가 뜰 수 있음)."
          }

          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" @signArgs packaging/windows/ymemo.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 실패" }
          Remove-Item -Force "$PWD/cert.pfx" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item packaging/windows/Output/ymemo-setup-x86_64.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: dist/ymemo-setup-x86_64.exe

  android-libs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup update stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build .so for all ABIs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o jniLibs build --release -p ymemo-ffi
          zip -r ymemo-ffi-android-jniLibs.zip jniLibs
      - uses: actions/upload-artifact@v4
        with:
          name: android-libs
          path: ymemo-ffi-android-jniLibs.zip

  ios-lib:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup update stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Build static libs (device + simulator)
        run: |
          cargo build --release --target aarch64-apple-ios -p ymemo-ffi
          cargo build --release --target aarch64-apple-ios-sim -p ymemo-ffi
          mkdir -p ios-libs/device ios-libs/simulator
          cp target/aarch64-apple-ios/release/libymemo_ffi.a ios-libs/device/
          cp target/aarch64-apple-ios-sim/release/libymemo_ffi.a ios-libs/simulator/
          zip -r ymemo-ffi-ios.zip ios-libs
      - uses: actions/upload-artifact@v4
        with:
          name: ios-lib
          path: ymemo-ffi-ios.zip

  release:
    needs: [linux-desktop, fedora-desktop, windows-desktop, android-libs, ios-lib]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            ymemo_*_amd64.deb \
            ymemo-*.rpm \
            ymemo-setup-x86_64.exe \
            ymemo-ffi-android-jniLibs.zip \
            ymemo-ffi-ios.zip
