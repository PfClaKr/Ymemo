[package]
name = "ymemo-ffi"
description = "Ymemo FFI layer for Flutter; flutter_rust_bridge scans src/api.rs to generate the Dart bindings."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# staticlib for iOS (.a), cdylib for Android (.so), rlib for host tests
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
ymemo-core.workspace = true
ymemo-i18n.workspace = true
anyhow.workspace = true
# Device-local settings, stored as JSON next to the vault (see api.rs).
serde.workspace = true
serde_json.workspace = true
# Runtime used by the generated src/frb_generated.rs.
flutter_rust_bridge.workspace = true
