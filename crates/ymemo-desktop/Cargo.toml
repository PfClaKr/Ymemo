[package]
name = "ymemo-desktop"
description = "Ymemo desktop app (Slint): the sticky-note UI on top of ymemo-core."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ymemo-core.workspace = true
ymemo-i18n.workspace = true
slint.workspace = true
i-slint-backend-winit.workspace = true
qrcode.workspace = true
image.workspace = true
rfd.workspace = true
directories.workspace = true
chrono.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

# Tray backend differs per platform; matches the cfg split in src/tray.rs.
[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true

# flock for the single-instance lock (src/instance.rs).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
# The named mutex behind the single-instance lock (src/instance.rs).
windows-sys.workspace = true

[build-dependencies]
slint-build.workspace = true
# build.rs turns the i18n catalog into a Slint global plus its setter.
serde_json.workspace = true
ymemo-i18n.workspace = true

# Windows only: embeds the icon and version resources into the exe (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
