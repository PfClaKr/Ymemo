# Ymemo 모바일 (Flutter). Rust 코어는 crates/ymemo-ffi 를 flutter_rust_bridge 로 사용.
name: ymemo_mobile
description: Local-first encrypted memo app (mobile).
publish_to: "none"
version: 0.1.0

environment:
  # PopScope.onPopInvokedWithResult 를 쓰므로 Flutter 3.24(Dart 3.5) 이상이 필요하다.
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Rust FFI 바인딩 런타임 (생성 코드가 사용).
  # **codegen CLI 와 정확히 같은 버전이어야 한다** (다르면 generate 가 거부한다):
  #   cargo install flutter_rust_bridge_codegen --version 2.11.1
  # 그래서 캐럿(^) 없이 못 박는다 — pub 이 2.12 로 올려 버리면 CLI 와 어긋난다.
  flutter_rust_bridge: 2.11.1
  # 플랫폼별 앱 데이터 디렉터리 (vault/캐시 경로)
  path_provider: ^2.1.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
