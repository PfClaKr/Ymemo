# Ymemo mobile (Flutter). The Rust core is reached through crates/ymemo-ffi.
name: ymemo_mobile
description: Local-first encrypted memo app (mobile).
publish_to: "none"
version: 0.1.0

environment:
  # PopScope.onPopInvokedWithResult needs Flutter 3.24 (Dart 3.5) or newer.
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Runtime for the generated Rust FFI bindings.
  # **Must match the codegen CLI exactly**, or generate refuses to run:
  #   cargo install flutter_rust_bridge_codegen --version 2.11.1
  # Hence no caret: pub bumping this to 2.12 would break the match.
  flutter_rust_bridge: 2.11.1
  # QR scanning for pairing codes; the plugin requests the permission at runtime.
  image_picker: ^1.2.3
  mobile_scanner: ^7.4.0
  # Per-platform app data directory (vault and cache paths).
  path_provider: ^2.1.0
  # Where the "stay unlocked" key is kept: Android's EncryptedSharedPreferences behind a
  # Keystore-held master key. Hand-rolling that in Kotlin would mean shipping crypto nobody
  # has run; this is the same reasoning that bundles syncthing whole.
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
