[workspace]
resolver = "2"
members = ["crates/ymemo-core", "crates/ymemo-desktop", "crates/ymemo-ffi", "crates/ymemo-i18n"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/PfClaKr/Ymemo"
authors = ["PfClaKr"]

# 공용 의존성. 각 crate 는 `xxx.workspace = true` 로 참조한다.
[workspace.dependencies]
ymemo-core = { path = "crates/ymemo-core" }
ymemo-i18n = { path = "crates/ymemo-i18n" }

# GUI (데스크탑)
# slint 와 i-slint-backend-winit 은 반드시 같은 버전이어야 한다 (내부 크레이트 공유).
# renderer-software: OpenGL 없이 CPU 로 그리는 폴백 렌더러. GL 드라이버가 부실한
# 환경(특히 Windows VM/RDP/구형 드라이버)에서 femtovg 대신 쓴다.
slint = { version = "1.17", features = ["renderer-software"] }
slint-build = "1.17"
i-slint-backend-winit = "1.17" # 무프레임 창의 네이티브 드래그(drag_window) 접근용
qrcode = { version = "0.14", default-features = false } # 페어링 QR (렌더링은 slint 이미지로 직접)
# 트레이 아이콘 (플랫폼별, ymemo-desktop 에서 cfg 로 갈라 쓴다)
#  - Linux: ksni — StatusNotifierItem (zbus 기반 순수 Rust, libdbus/gtk 불필요)
#  - Windows: tray-icon — Shell_NotifyIcon. default-features off 로 gtk/libxdo(리눅스 C 의존) 제외
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
tray-icon = { version = "0.24", default-features = false }

# 저장소 / 데이터
rusqlite = { version = "0.32", features = ["bundled"] } # bundled: 시스템 libsqlite3 불필요, 소스에서 컴파일
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
directories = "5"

# CRDT: 순서 무관 병합 (P2P 다기기 동기화의 핵심)
automerge = "0.10"

# 암호화 (순수 Rust RustCrypto: 시스템 libsodium 불필요, 크로스컴파일 용이)
chacha20poly1305 = "0.10" # XChaCha20-Poly1305 AEAD (24B nonce)
argon2 = "0.5"            # Argon2id 키 유도
rand = "0.8"              # salt/nonce 생성 (OsRng)

# Syncthing REST 제어용 HTTP 클라이언트 (localhost 전용이라 TLS 불필요)
ureq = { version = "3", default-features = false, features = ["json"] }

# 공통 유틸
anyhow = "1"
