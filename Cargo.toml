[workspace]
resolver = "2"
members = ["crates/ymemo-core", "crates/ymemo-desktop", "crates/ymemo-ffi", "crates/ymemo-i18n"]

[workspace.package]
version = "1.0.4"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/PfClaKr/Ymemo"
authors = ["PfClaKr"]

# Shared dependencies; crates pull them in with `xxx.workspace = true`.
[workspace.dependencies]
ymemo-core = { path = "crates/ymemo-core" }
ymemo-i18n = { path = "crates/ymemo-i18n" }

# Desktop GUI.
# slint and i-slint-backend-winit must stay on the same version (shared internal crates).
# renderer-software is the CPU fallback renderer, used instead of femtovg where the GL
# driver is weak (Windows VMs, RDP, old drivers).
slint = { version = "1.17", features = ["renderer-software"] }
slint-build = "1.17"
i-slint-backend-winit = "1.17" # native drag_window for frameless windows
qrcode = { version = "0.14", default-features = false } # pairing QR, rendered into a slint image
# Decodes attached photos to RGBA for Slint. Only the two codecs phones and cameras
# produce; the default feature set drags in formats we never use.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# File picker: xdg-desktop-portal on Linux (pure Rust, no system GTK) and the native
# dialog on Windows, so CI needs no extra system packages.
# It must be async-std: with tokio, rfd -> ashpd -> zbus pulls in the tokio backend, and
# feature unification gives ksni's zbus the same backend, so the tray panics on the main
# thread where there is no runtime.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
# Tray icon, selected by cfg in ymemo-desktop:
#  - Linux: ksni, a StatusNotifierItem over zbus (pure Rust, no libdbus/gtk)
#  - Windows: tray-icon (Shell_NotifyIcon); default features off to drop gtk/libxdo
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
tray-icon = { version = "0.24", default-features = false }
# Keeping the sticky windows out of the taskbar on X11 (`_NET_WM_STATE_SKIP_TASKBAR`), which
# winit exposes no API for. Already in the tree — winit's own X11 backend is built on it — so
# this only makes an existing crate reachable from our code.
x11rb = "0.13"

# Storage and data
rusqlite = { version = "0.32", features = ["bundled"] } # compiled from source, no system libsqlite3
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
directories = "5"

# CRDT: order-independent merging, the heart of P2P multi-device sync
automerge = "0.10"

# Crypto (pure Rust RustCrypto: no system libsodium, easy cross-compilation)
chacha20poly1305 = "0.10" # XChaCha20-Poly1305 AEAD (24B nonce)
argon2 = "0.5"            # Argon2id key derivation
rand = "0.8"              # OsRng for salts and nonces
sha2 = "0.10"             # blob content hashes (file name + convergent nonce)

# HTTP client. Syncthing's REST API is localhost and needs no TLS, but the update check talks
# to api.github.com, so rustls is in. The roots are the bundled Mozilla set rather than the
# platform's: one behaviour on every OS, and nothing to configure on Android.
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

# Process lifetime plumbing, per OS. The sync daemon must never outlive the app: a killed
# app (installer, task manager, crash) that leaves it running keeps its binary locked on
# Windows and keeps syncing on Linux, which is what makes uninstalling messy.
#  - unix: prctl(PR_SET_PDEATHSIG) on the child, and flock for the single-instance lock
#  - windows: a job object with KILL_ON_JOB_CLOSE, and a named mutex for that same lock
libc = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # WS_EX_TOOLWINDOW on the sticky windows: the shell's own "not an application", and the
    # only way to keep it from handing one a taskbar button in the first place.
    "Win32_UI_WindowsAndMessaging",
] }

# Flutter binding runtime. The runtime, the codegen CLI and the Dart package must all be
# the exact same version, hence the pin (see apps/mobile/pubspec.yaml).
flutter_rust_bridge = "=2.11.1"

# Local-time formatting for the created-at stamp on a sticky. Already in the tree — slint
# pulls chrono for its own date support — so this only turns on the `clock` feature.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Common utilities
anyhow = "1"
